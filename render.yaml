# Render deployment blueprint for Unkwnphoto.
# Render runs the Express server as a persistent Node process, which serves
# both the API and the built front end from a single URL.
services:
  - type: web
    name: unkwnphoto
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
